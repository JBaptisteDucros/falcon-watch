name: Falcon 8X watch

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes
  workflow_dispatch:          # permet de le lancer à la main

permissions:
  contents: write             # pour sauvegarder l'état entre deux passages

concurrency:
  group: falcon-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check pages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python falcon_watch.py --once

      - name: Save state
        run: |
          git config user.name "falcon-bot"
          git config user.email "falcon-bot@users.noreply.github.com"
          git add falcon_watch_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
